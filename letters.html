<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>读者来信 · 观子喻知 YuSpectra</title>
  <meta name="description" content="观子喻知 YuSpectra 的读者来信：把读者的问题整理成笔记。只放笔记本身，不展示来信原文与来信人。">
  <meta name="theme-color" content="#f8f9fb">
  <meta property="og:type" content="website">
  <meta property="og:title" content="读者来信 · 观子喻知 YuSpectra">
  <meta property="og:description" content="信里问的都是具体的事，所以回信也尽量给具体的答案。">
  <meta property="og:image" content="assets/img/og-cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://yuspectra.github.io/chaiAI/letters.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="观子喻知 YuSpectra RSS" href="rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="letters">
  <div class="bg-fx" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main">
    <section class="container page-head">
      <span class="eyebrow">Letters / 读者来信</span>
      <h1>读者来信</h1>
      <p>读者问过的问题，回答整理成笔记，收在这里。只有笔记本身，没有来信原文，也不列来信人。</p>
    </section>

    <section class="section section--tight">
      <div class="container--narrow">
        <div class="glass letters-note reveal">
          <ul class="letters-note__rules">
            <li><strong>只回具体的问题</strong>先弄清你在问什么，再谈我的看法。</li>
            <li><strong>不给万能答案</strong>能落到一个动作上的，才算答案。</li>
            <li><strong>只放笔记</strong>来信原文、来信人一概不展示。</li>
          </ul>
          <div class="btn-row">
            <a class="btn btn--primary btn--sm" href="connect.html#letter">写一封信给我</a>
            <span class="letters-note__hint">留了邮箱的话，会先收到一封自动回复。</span>
          </div>
        </div>

        <div class="letters-list" id="letters-list"></div>
        <div class="empty-state" id="letters-empty" hidden>
          <h3>还没有公开的回信</h3>
          <p>第一封正在写。有想问的，可以直接<a class="text-link" href="connect.html#letter">写信过来</a>。</p>
        </div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="glass cta-banner reveal"><h2>你的问题也可以出现在这里</h2><p>读完一本书想不通的地方、看一段视频留下的疑问，都可以写下来。不一定有答案，但一定会认真回。</p>
          <div class="btn-row" style="justify-content:center"><a class="btn btn--primary" href="connect.html#letter">写一封信</a><a class="btn btn--ghost" href="notes.html">先看看笔记 →</a></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
