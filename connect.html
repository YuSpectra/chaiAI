<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接 · 观子喻知 YuSpectra</title>
  <meta name="description" content="连接观子喻知 YuSpectra：在留言板写一封信给子喻，或通过公众号与视频号的演示二维码找到这里。">
  <meta name="theme-color" content="#f8f9fb">
  <meta property="og:type" content="website">
  <meta property="og:title" content="连接 · 观子喻知 YuSpectra">
  <meta property="og:description" content="在留言板写一封信给子喻，或通过公众号与视频号找到这里。">
  <meta property="og:image" content="assets/img/og-cover.svg">
  <link rel="canonical" href="https://chai.aibay.asia/connect.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="观子喻知 YuSpectra RSS" href="rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="connect">
  <div class="bg-fx" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main">
    <section class="container page-head">
      <span class="eyebrow">Connect</span>
      <h1>连接</h1>
      <p>读到什么、看到什么，都可以写在这儿。看到有意思的东西，也欢迎随时告诉我。</p>
    </section>

    <section class="section section--tight" id="letter">
      <div class="container">
        <div class="letter">
          <div class="letter__aside">
            <span class="eyebrow">Write / 留言</span>
            <h2>写一封信给我</h2>
            <p>读到一段有用的东西、看到一处好看的光，或者只是想打个招呼，都可以写在这里。信会直接送到我的收件箱，我会一封一封看完。</p>
          </div>

          <form class="letter__form" id="letter-form" action="https://formsubmit.co/1414330095@qq.com" method="POST">
            <input type="hidden" name="_subject" value="【观子喻知】读者来信">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://yuspectra.github.io/chaiAI/connect.html?sent=1#letter">
            <input type="hidden" name="表单类型" value="读者来信">
            <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">

            <div class="field">
              <label for="lf-name">怎么称呼你</label>
              <input id="lf-name" name="称呼" type="text" maxlength="40" placeholder="选填">
            </div>

            <div class="field">
              <label for="lf-msg">想说的话 <span class="field__hint">选填</span></label>
              <textarea id="lf-msg" name="留言内容" rows="7" maxlength="2000" placeholder="最近在读什么、看到了什么，或者只是想打个招呼。"></textarea>
            </div>

            <div class="field">
              <label for="lf-email">联系邮箱 <span class="field__hint">如想收到回信，请留一个</span></label>
              <input id="lf-email" name="联系方式" type="email" maxlength="120" placeholder="选填，不会公开">
            </div>

            <button class="btn btn--primary letter__submit" type="submit">寄出这封信</button>
            <p class="letter__privacy">表单会直接转发到我的邮箱，你的地址不会公开在网站上。</p>
            <p class="letter__status" id="letter-status" role="status" hidden></p>
          </form>
        </div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="qr-grid" id="connect-cards"></div>
        <p class="connect-note">虚拟二维码 · 演示用，暂不可扫码；按钮与外链当前均指向本站 · 替换方式见 README.md</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container" id="connect-links"></div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="glass cta-banner reveal"><h2>先把这里逛完也不迟</h2><p>六篇笔记、四支视频、八张影像，都是可随时替换的本地示例内容。</p>
          <div class="btn-row" style="justify-content:center"><a class="btn btn--primary" href="index.html">回到首页</a><a class="btn btn--ghost" href="search.html">全站搜索</a></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
