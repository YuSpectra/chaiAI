<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="观子喻知 YuSpectra 的观测笔记：读书笔记、观察随笔、创作手记与影像笔记。支持标签筛选与关键词搜索。">
  <meta name="theme-color" content="#f8f9fb">
  <meta property="og:type" content="website">
  <meta property="og:title" content="观测笔记 · 观子喻知 YuSpectra">
  <meta property="og:description" content="向外体察，读懂万象，启思创造，拥抱探索。">
  <meta property="og:image" content="assets/img/og-cover.svg">
  <link rel="canonical" href="https://chai.aibay.asia/notes.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body data-page="notes">
  <div class="bg-fx" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main id="main">
    <section class="container page-head">
      <span class="eyebrow">Observation notes</span>
      <h1>观测笔记</h1>
      <p>把读到、看到、想到的东西拆开再放回去。这里收录读书笔记、观察随笔、创作手记与影像笔记。</p>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="toolbar">
          <div class="filter-row" id="notes-filters" aria-label="按标签筛选"></div>
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <input id="notes-search" type="search" placeholder="搜索标题、摘要或标签" aria-label="搜索观测笔记">
          </label>
        </div>
        <p class="result-count" id="notes-count"></p>
        <div class="card-grid" id="notes-grid"></div>
        <div class="empty-state" id="notes-empty" hidden><h3>这个组合下暂时没有笔记</h3><p>换个标签或关键词，或去 <a class="text-link" href="search.html">全站搜索</a> 看看。</p></div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="glass cta-banner reveal"><h2>换个方式继续探索</h2><p>按标签浏览、看视频、翻影像，或者直接从公众号读起。</p>
          <div class="btn-row" style="justify-content:center"><a class="btn btn--primary" href="tags.html">标签索引</a><a class="btn btn--ghost" href="connect.html">查看连接方式 →</a></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
